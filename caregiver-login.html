<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caregiver Login</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="caregiver-login.html" aria-label="Home">
        <span class="brand-badge" aria-hidden="true"></span>
        <span>CareHub</span>
      </a>
      <nav class="nav">
        <a class="pill" href="caregiver-register.html">Register</a>
        <a class="pill" href="visit-form.html">Record Visit</a>
        <a class="pill" href="patient-login.html">Patient Portal</a>
        <a class="pill" href="caregiver.html">Dashboard</a>
        <button class="pill" id="themeToggle" type="button" aria-label="Toggle day/night theme">Day</button>
      </nav>
    </div>
  </header>

  <main class="container hero">
    <div class="hero-grid one">
      <section class="card card-pad">
        <h1 class="h1">Caregiver login</h1>
        <p class="sub">Sign in to start today’s patient visits, then open the dashboard.</p>

        <div class="notice" id="loginNotice" hidden></div>

        <form class="form" id="caregiverLoginForm" autocomplete="on">
          <div>
            <div class="label">Email</div>
            <input class="input" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <div class="label">Password</div>
            <input class="input" name="password" type="password" placeholder="Your password" required />
          </div>

          <div class="stack">
            <button class="btn btn-primary" type="submit">Login</button>
            <a class="btn btn-ghost" href="caregiver-register.html">Create account</a>
          </div>

          <div class="notice" id="whoami"></div>
        </form>
      </section>
    </div>

    <div class="footer">© 2026 CareHub — UI prototype</div>
  </main>

  <script src="static/js/app.js"></script>
</body>
</html>
