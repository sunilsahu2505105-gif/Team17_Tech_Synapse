<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caregiver Registration</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="caregiver-login.html" aria-label="Home">
        <span class="brand-badge" aria-hidden="true"></span>
        <span>CareHub</span>
      </a>
      <nav class="nav">
        <a class="pill" href="caregiver-login.html">Caregiver Login</a>
        <a class="pill" href="visit-form.html">Record Visit</a>
        <a class="pill" href="patient-login.html">Patient Portal</a>
        <a class="pill" href="caregiver.html">Dashboard</a>
        <button class="pill" id="themeToggle" type="button" aria-label="Toggle day/night theme">Day</button>
      </nav>
    </div>
  </header>

  <main class="container hero">
    <div class="hero-grid one">
      <section class="card card-pad">
        <h1 class="h1">Caregiver registration</h1>

        <div class="notice" id="registerNotice" hidden></div>

        <form class="form" id="caregiverRegisterForm" autocomplete="on">
          <div>
            <div class="label">Full name *</div>
            <input class="input" name="fullName" placeholder="e.g., Riya Sharma" required />
          </div>

          <div class="row2">
            <div>
              <div class="label">Phone number (10 digits) *</div>
              <input class="input" name="phone" inputmode="numeric" placeholder="9876543210" required />
            </div>
            <div>
              <div class="label">Aadhaar (12 digits) *</div>
              <input class="input" name="aadhaar" inputmode="numeric" placeholder="123412341234" required />
            </div>
          </div>

          <div class="row3">
            <div>
              <div class="label">Experience (years) *</div>
              <input class="input" name="experienceYears" type="number" min="0" max="60" placeholder="3" required />
            </div>
            <div>
              <div class="label">Specialization</div>
              <input class="input" name="specialization" placeholder="Elder care, post-op, etc." />
            </div>
            <div>
              <div class="label">Shift</div>
              <select class="input" name="shift">
                <option>Flexible</option>
                <option>Day</option>
                <option>Night</option>
                <option>24x7</option>
              </select>
            </div>
          </div>

          <div class="row2">
            <div>
              <div class="label">Email *</div>
              <input class="input" name="email" type="email" placeholder="you@example.com" required />
            </div>
            <div>
              <div class="label">Password *</div>
              <input class="input" name="password" type="password" placeholder="Create a password" required />
            </div>
          </div>

          <div class="row2">
            <div>
              <div class="label">City</div>
              <input class="input" name="city" placeholder="Mumbai" />
            </div>
            <div>
              <div class="label">Languages</div>
              <input class="input" name="languages" placeholder="Hindi, English" />
            </div>
          </div>

          <div>
            <div class="label">Registration No. (optional)</div>
            <input class="input" name="regNo" placeholder="Clinic/Agency ID" />
          </div>

          <div class="stack">
            <button class="btn btn-primary" type="submit">Create account</button>
            <a class="btn btn-ghost" href="caregiver-login.html">I already have an account</a>
          </div>
        </form>
      </section>
    </div>

    <div class="footer">© 2026 CareHub</div>
  </main>

  <script src="static/js/app.js"></script>
</body>
</html>
